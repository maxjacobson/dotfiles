[user]
name = "Maxwell Jacobson"
email = "max@hardscrabble.net"

# Use work email for repos under FAMLI directory
[[--scope]]
--when.repositories = ["~/FAMLI"]
[--scope.user]
email = "maxwell.jacobson@maryland.gov"

[signing]
behavior = "force"
backend = "ssh"
key = "~/.ssh/id_ed25519"

[ui]
default-command = "log"
editor = "nvim"
diff-formatter = ":git"
pager = ["delta", "--syntax-theme", "Catppuccin Macchiato"]

[git]
colocate = false

# Show author name and email in log
[template-aliases]
'format_short_signature(signature)' = 'signature.email() ++ " (" ++ signature.name() ++ ")"'

[templates]
draft_commit_description = 'builtin_draft_commit_description_with_diff'
